<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Administracao - Pizzaria Online</title>
    <style>
        :root {
            --bg: #f4f4f8;
            --card: #ffffff;
            --text: #222;
            --muted: #666;
            --primary: #d9534f;
            --primary-dark: #c9302c;
            --border: #e1e3ea;
            --danger: #b42318;
            --dark: #333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 24px auto;
            display: grid;
            gap: 20px;
        }

        header,
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 24px;
        }

        header h1,
        .card h2 {
            margin-top: 0;
        }

        form {
            display: grid;
            gap: 12px;
        }

        label {
            font-size: 0.95rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 1rem;
        }

        button {
            width: fit-content;
            padding: 11px 18px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .actions,
        .table-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .secondary-button,
        .edit-button {
            background: var(--dark);
        }

        .secondary-button:hover,
        .edit-button:hover {
            background: #111;
        }

        .danger-button {
            background: var(--danger);
        }

        .danger-button:hover {
            background: #7a1712;
        }

        .message {
            margin-top: 12px;
            color: var(--muted);
        }

        @media (max-width: 720px) {
            .container {
                width: calc(100% - 24px);
            }

            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Painel de Administracao</h1>
            <p>Cadastre, busque, edite e exclua pizzas do cardapio.</p>
            <p><a href="index.html">Voltar para pagina do cliente</a></p>
        </header>

        <section class="card">
            <h2>Cadastro de Pizza</h2>
            <form id="pizza-form">
                <input type="hidden" id="pizza-id" />

                <label for="pizza-nome">Nome</label>
                <input type="text" id="pizza-nome" required />

                <label for="pizza-descricao">Descricao</label>
                <input type="text" id="pizza-descricao" required />

                <label for="pizza-preco">Preco</label>
                <input type="number" id="pizza-preco" step="0.01" min="0" required />

                <div class="actions">
                    <button type="submit" id="pizza-submit">Adicionar Pizza</button>
                    <button type="button" id="pizza-cancel" class="secondary-button" hidden>Cancelar edicao</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Buscar Pizza</h2>
            <form id="pizza-search-form">
                <label for="pizza-search-id">ID da Pizza</label>
                <input type="number" id="pizza-search-id" min="1" required />
                <button type="submit">Buscar Pizza</button>
            </form>
            <div id="pizza-search-result"></div>
        </section>

        <section class="card">
            <h2>Cardapio Atual</h2>
            <div id="pizza-list">Carregando pizzas...</div>
        </section>
    </div>

    <script>
        const baseUrl = "http://127.0.0.1:8000";

        const pizzaForm = document.getElementById("pizza-form");
        const pizzaSearchForm = document.getElementById("pizza-search-form");
        const pizzaList = document.getElementById("pizza-list");
        const pizzaSearchResult = document.getElementById("pizza-search-result");
        const pizzaIdInput = document.getElementById("pizza-id");
        const pizzaNomeInput = document.getElementById("pizza-nome");
        const pizzaDescricaoInput = document.getElementById("pizza-descricao");
        const pizzaPrecoInput = document.getElementById("pizza-preco");
        const pizzaSubmit = document.getElementById("pizza-submit");
        const pizzaCancel = document.getElementById("pizza-cancel");

        async function fetchPizzas() {
            try {
                const response = await fetch(`${baseUrl}/pizzas`);
                const pizzas = await response.json();
                renderPizzas(pizzas);
            } catch (error) {
                pizzaList.innerHTML = `<p class="message">Erro ao carregar pizzas. Verifique se o backend esta rodando.</p>`;
            }
        }

        function pizzaRow(pizza) {
            return `
                <tr>
                    <td>${pizza.id}</td>
                    <td>${pizza.nome}</td>
                    <td>${pizza.descricao}</td>
                    <td>R$ ${Number(pizza.preco).toFixed(2)}</td>
                    <td>
                        <div class="table-actions">
                            <button type="button" class="edit-button" onclick="editPizza(${pizza.id})">Editar</button>
                            <button type="button" class="danger-button" onclick="deletePizza(${pizza.id})">Excluir</button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function renderPizzaTable(target, pizzas) {
            if (!pizzas.length) {
                target.innerHTML = `<p class="message">Nenhuma pizza encontrada.</p>`;
                return;
            }

            target.innerHTML = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>Nome</th><th>Descricao</th><th>Preco</th><th>Acoes</th></tr>
                    </thead>
                    <tbody>${pizzas.map(pizzaRow).join("")}</tbody>
                </table>
            `;
        }

        function renderPizzas(pizzas) {
            renderPizzaTable(pizzaList, pizzas);
        }

        function fillPizzaForm(pizza) {
            pizzaIdInput.value = pizza.id;
            pizzaNomeInput.value = pizza.nome;
            pizzaDescricaoInput.value = pizza.descricao;
            pizzaPrecoInput.value = pizza.preco;
            pizzaSubmit.textContent = "Atualizar Pizza";
            pizzaCancel.hidden = false;
        }

        function resetPizzaForm() {
            pizzaForm.reset();
            pizzaIdInput.value = "";
            pizzaSubmit.textContent = "Adicionar Pizza";
            pizzaCancel.hidden = true;
        }

        pizzaForm.addEventListener("submit", async event => {
            event.preventDefault();

            const pizzaId = pizzaIdInput.value;
            const nome = pizzaNomeInput.value.trim();
            const descricao = pizzaDescricaoInput.value.trim();
            const preco = parseFloat(pizzaPrecoInput.value);

            if (!nome || !descricao || Number.isNaN(preco)) return;

            try {
                await fetch(`${baseUrl}/pizzas${pizzaId ? `/${pizzaId}` : ""}`, {
                    method: pizzaId ? "PUT" : "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ nome, descricao, preco })
                });

                resetPizzaForm();
                fetchPizzas();
                pizzaSearchResult.innerHTML = "";
            } catch (error) {
                alert("Erro ao salvar pizza. Verifique se o backend esta rodando.");
            }
        });

        pizzaSearchForm.addEventListener("submit", async event => {
            event.preventDefault();

            const pizzaId = document.getElementById("pizza-search-id").value;
            if (!pizzaId) return;

            try {
                const response = await fetch(`${baseUrl}/pizzas/${pizzaId}`);
                const pizza = await response.json();
                renderPizzaTable(pizzaSearchResult, pizza ? [pizza] : []);
            } catch (error) {
                pizzaSearchResult.innerHTML = `<p class="message">Erro ao buscar pizza.</p>`;
            }
        });

        pizzaCancel.addEventListener("click", resetPizzaForm);

        window.editPizza = async function (pizzaId) {
            try {
                const response = await fetch(`${baseUrl}/pizzas/${pizzaId}`);
                const pizza = await response.json();
                if (!pizza) {
                    alert("Pizza nao encontrada.");
                    return;
                }

                fillPizzaForm(pizza);
                window.scrollTo({ top: 0, behavior: "smooth" });
            } catch (error) {
                alert("Erro ao carregar pizza.");
            }
        };

        window.deletePizza = async function (pizzaId) {
            if (!confirm("Deseja excluir esta pizza?")) return;

            try {
                await fetch(`${baseUrl}/pizzas/${pizzaId}`, {
                    method: "DELETE"
                });

                resetPizzaForm();
                fetchPizzas();
                pizzaSearchResult.innerHTML = "";
            } catch (error) {
                alert("Erro ao excluir pizza.");
            }
        };

        fetchPizzas();
    </script>
</body>
</html>
