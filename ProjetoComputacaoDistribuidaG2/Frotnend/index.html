<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizzaria Online</title>
    <style>
        :root {
            --bg: #f4f4f8;
            --card: #ffffff;
            --text: #222;
            --muted: #666;
            --primary: #d9534f;
            --primary-dark: #c9302c;
            --border: #e1e3ea;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 24px auto;
            display: grid;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        .admin-card {
            background: #fff8f4;
            border-color: #f1c0b9;
        }

        .card h2 {
            margin-top: 0;
        }

        form {
            display: grid;
            gap: 12px;
        }

        label {
            font-size: 0.95rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 1rem;
        }

        button {
            width: fit-content;
            padding: 11px 18px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            color: var(--muted);
        }

        .status-button {
            background: #333;
            padding: 8px 12px;
            border-radius: 10px;
        }

        .status-button:hover {
            background: #111;
        }

        .message {
            margin-top: 12px;
            color: var(--muted);
        }

        @media (max-width: 720px) {
            .container {
                width: calc(100% - 24px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pizzaria Online</h1>
            <p>Área do cliente: faça pedidos e veja o cardápio.</p>
            <p><a href="admin.html">Ir para painel de administração</a></p>
        </header>

        <section class="card">
            <h2>Cardápio de Pizzas</h2>
            <div id="pizza-list">Carregando pizzas...</div>
        </section>

        <section class="card">
            <h2>Novo Pedido</h2>
            <form id="pedido-form">
                <label>Nome do Cliente</label>
                <input type="text" id="pedido-cliente" required />
                <button type="submit">Criar Pedido</button>
            </form>
        </section>

        <section class="card">
            <h2>Pedidos</h2>
            <div id="pedido-list">Carregando pedidos...</div>
        </section>
    </div>

    <script>
        const baseUrl = "http://127.0.0.1:8000";

        const pedidoForm = document.getElementById("pedido-form");
        const pizzaList = document.getElementById("pizza-list");
        const pedidoList = document.getElementById("pedido-list");

        async function fetchPizzas() {
            try {
                const response = await fetch(`${baseUrl}/pizzas`);
                const pizzas = await response.json();
                renderPizzas(pizzas);
            } catch (error) {
                pizzaList.innerHTML = `<p class="message">Erro ao carregar pizzas. Verifique se o backend está rodando.</p>`;
            }
        }

        async function fetchPedidos() {
            try {
                const response = await fetch(`${baseUrl}/pedidos`);
                const pedidos = await response.json();
                renderPedidos(pedidos);
            } catch (error) {
                pedidoList.innerHTML = `<p class="message">Erro ao carregar pedidos. Verifique se o backend está rodando.</p>`;
            }
        }

        function renderPizzas(pizzas) {
            if (!pizzas.length) {
                pizzaList.innerHTML = `<p class="message">Nenhuma pizza encontrada.</p>`;
                return;
            }

            pizzaList.innerHTML = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>Nome</th><th>Descrição</th><th>Preço</th></tr>
                    </thead>
                    <tbody>
                        ${pizzas
                            .map(
                                pizza => `
                            <tr>
                                <td>${pizza.id}</td>
                                <td>${pizza.nome}</td>
                                <td>${pizza.descricao}</td>
                                <td>R$ ${pizza.preco.toFixed(2)}</td>
                            </tr>`
                            )
                            .join("")}
                    </tbody>
                </table>
            `;
        }

        function renderPedidos(pedidos) {
            if (!pedidos.length) {
                pedidoList.innerHTML = `<p class="message">Nenhum pedido registrado.</p>`;
                return;
            }

            pedidoList.innerHTML = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>Cliente</th><th>Status</th><th>Ação</th></tr>
                    </thead>
                    <tbody>
                        ${pedidos
                            .map(
                                pedido => `
                            <tr>
                                <td>${pedido.id}</td>
                                <td>${pedido.cliente}</td>
                                <td>${pedido.status}</td>
                                <td><button class="status-button" onclick="updateStatus(${pedido.id})">Atualizar status</button></td>
                            </tr>`
                            )
                            .join("")}
                    </tbody>
                </table>
            `;
        }

        pedidoForm.addEventListener("submit", async event => {
            event.preventDefault();

            const cliente = document.getElementById("pedido-cliente").value.trim();
            if (!cliente) return;

            try {
                await fetch(`${baseUrl}/pedidos`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ cliente })
                });

                pedidoForm.reset();
                fetchPedidos();
            } catch (error) {
                alert("Erro ao criar pedido. Verifique o backend.");
            }
        });

        window.updateStatus = async function (pedidoId) {
            const novoStatus = prompt("Novo status do pedido:", "Em preparo");
            if (!novoStatus) return;

            try {
                const url = new URL(`${baseUrl}/pedidos/${pedidoId}/status`);
                url.searchParams.set("status", novoStatus);

                await fetch(url.toString(), {
                    method: "PUT"
                });

                fetchPedidos();
            } catch (error) {
                alert("Erro ao atualizar status. Verifique o backend.");
            }
        };

        fetchPizzas();
        fetchPedidos();
    </script>
</body>
</html>
